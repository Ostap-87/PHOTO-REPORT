# Настройки ФотоОтчёта. Меняются без программирования; после правки перезапустите приложение.

# Скачать модель распознавания (~230 МБ) при первом запуске автоматически.
# Модель хранится в ~/.cache/photo-report/models и скачивается один раз.
auto_download_models: true

# Раскладка фото по пунктам ТЗ. Пустые значения — заводские (app/vision/classify.py, DEFAULTS).
classify:
  # Минимальная уверенность (0..1), чтобы положить фото в пункт без вопроса (заводская 0.6;
  # 0.5 — смелее: больше фото раскладывается, но чаще с ошибкой).
  # Ниже — фото остаётся в «Неразобранном» с подсказками.
  threshold:
  # Насколько лучший пункт должен опережать второй (заводской 0.2). Меньше — смелее, больше — осторожнее.
  margin:
